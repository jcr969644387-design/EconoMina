name: economina
description: >-
  EconoMina: Simulador de Economía y Evaluación Minera. Aplicación educativa
  para estudiantes de Ingeniería de Minas.
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Guarda el progreso y el proyecto activo en el dispositivo (sin red).
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
