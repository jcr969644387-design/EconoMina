name: Build APK

on:
  # Compila el APK en cada cambio que llega a main, sin pasos manuales.
  push:
    branches:
      - main
    tags:
      - "v*"
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

env:
  # Versión estable con la que se alinearon Gradle, AGP y Kotlin del proyecto.
  FLUTTER_VERSION: "3.47.x"

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK universal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: econo-mina-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      # Con un tag v* el APK queda en una release, descargable sin iniciar sesión.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk EconoMina-${{ github.ref_name }}.apk
          gh release create "${{ github.ref_name }}" \
            "EconoMina-${{ github.ref_name }}.apk" \
            --title "EconoMina ${{ github.ref_name }}" \
            --generate-notes
